</script>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1c2333; --muted:#6f7a91; --line:#e7eaf1;
  --accent:#ff7a30; --accent-soft:#fff1e8; --side:#151b2c;
  --star:#16a34a; --plow:#2563eb; --puzzle:#9333ea; --dog:#dc2626;
  --star-bg:#e9f9ef; --plow-bg:#e8f0fe; --puzzle-bg:#f4ebfd; --dog-bg:#fdeaea;
  --shadow:0 1px 3px rgba(20,30,55,.06),0 6px 18px rgba(20,30,55,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Prompt',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:232px;background:var(--side);color:#aab2c5;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s}
.logo{padding:20px 20px 16px;border-bottom:1px solid #232b40}
.logo .t1{color:#fff;font-weight:600;font-size:15px;line-height:1.3;word-break:break-word}
.logo .t2{font-size:11px;color:#7b85a0;margin-top:2px}
.ed-badge{display:inline-block;margin-top:8px;color:#fff;font-size:10px;padding:2px 9px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.ed-basic{background:#475569}.ed-pro{background:linear-gradient(90deg,#ff7a30,#f43f5e)}.ed-demo{background:var(--accent)}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-sec{font-size:10px;color:#5d6780;text-transform:uppercase;letter-spacing:.6px;padding:12px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;margin-bottom:2px;transition:.15s;user-select:none}
.nav-item:hover{background:#1e2740;color:#fff}
.nav-item.active{background:var(--accent);color:#fff;font-weight:500}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item .pro-chip{margin-left:auto;font-size:9px;font-weight:600;background:#2a3350;color:#ffb38a;padding:1px 6px;border-radius:10px}
.nav-item.active .pro-chip{background:rgba(255,255,255,.25);color:#fff}
.side-foot{padding:12px 20px;border-top:1px solid #232b40;font-size:10.5px;color:#5d6780;line-height:1.55}
.side-foot a{color:#ffb38a}
.scrim{display:none}
.pro-tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.3px;background:linear-gradient(90deg,#ff7a30,#f43f5e);color:#fff;padding:1px 6px;border-radius:8px;margin:0 4px;vertical-align:middle;line-height:1.5}
.banner.pro{background:linear-gradient(90deg,#fff1e8,#fff5f5);border:1px solid #ffd2b8;color:#9a3412}
/* main */
.main{flex:1;margin-left:232px;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 26px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .ttl{flex:1;min-width:0}
.topbar h1{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.hamb{display:none;border:none;background:none;font-size:22px;cursor:pointer;padding:2px 6px;color:var(--ink)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.range-sel{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;background:var(--card);color:var(--ink);cursor:pointer}
.range-custom{display:flex;gap:4px;align-items:center;font-size:12px}
.range-custom input{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#c9cfdd;background:#f8f9fc}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.primary:hover{background:#f06a1f}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--dog);border-color:#f3c2c2}
.btn.danger:hover{background:var(--dog-bg)}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang-toggle button{border:none;background:var(--card);padding:6px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.lang-toggle button.on{background:var(--ink);color:#fff;font-weight:500}
.content{padding:22px 26px 40px;flex:1;min-width:0}
/* banners */
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:12.5px;line-height:1.5}
.banner.info{background:#eef4ff;border:1px solid #d6e3ff;color:#1e3a8a}
.banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.banner .sp{flex:1;min-width:180px}
/* cards & grids */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:13px;padding:15px 17px;box-shadow:var(--shadow);min-width:0}
.kpi .lab{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.kpi .val{font-size:21px;font-weight:600;line-height:1.15;word-break:break-word}
.kpi .val small{font-size:12px;font-weight:400;color:var(--muted)}
.kpi .delta{font-size:11px;margin-top:5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid32{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
.card{background:var(--card);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);min-width:0;margin-bottom:16px}
.grid2>.card,.grid32>.card{margin-bottom:0}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:4px}
.card .desc{font-size:11.5px;color:var(--muted);margin-bottom:12px;line-height:1.55}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chart-box{position:relative;height:260px}
.chart-box.tall{height:360px}
.chart-box.short{height:210px}
.sec-title{font-size:14px;font-weight:600;margin:4px 0 10px}
/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-wrap.scroll{max-height:440px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 10px;color:var(--muted);font-weight:500;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.num,td.num{text-align:right}
td{padding:8px 10px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
tr:hover td{background:#fafbfe}
tfoot td{font-weight:600;border-top:1px solid var(--line)}
.sub-txt{font-size:10.5px;color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:500;white-space:nowrap}
.tag.STAR{background:var(--star-bg);color:var(--star)}
.tag.PLOW{background:var(--plow-bg);color:var(--plow)}
.tag.PUZZLE{background:var(--puzzle-bg);color:var(--puzzle)}
.tag.DOG{background:var(--dog-bg);color:var(--dog)}
.tag.warn{background:#fef3e2;color:#b45309}
.tag.ok{background:var(--star-bg);color:var(--star)}
.tag.grey{background:#eef1f6;color:#5b6478}
.mini-bar{height:6px;border-radius:4px;background:var(--accent);min-width:2px}
.up{color:var(--star);font-weight:600}.down{color:var(--dog);font-weight:600}.neutral{color:var(--muted)}
/* data page */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:9px;cursor:pointer;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--muted);user-select:none}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:500}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.toolbar .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;width:220px;max-width:100%;background:var(--card)}
.search:focus{outline:none;border-color:var(--accent)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.icon-btn{border:none;background:none;cursor:pointer;font-size:14px;padding:3px 6px;border-radius:6px;opacity:.6}
.icon-btn:hover{opacity:1;background:#f0f2f7}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:12.5px;line-height:1.7}
.note{font-size:11.5px;color:var(--muted);background:#f8f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin-bottom:14px;line-height:1.6}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
.modal{background:var(--card);border-radius:15px;padding:22px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto}
.modal.wide{width:760px}
.modal h3{font-size:15px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;background:var(--card);color:var(--ink)}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field input.err{border-color:var(--dog);background:#fff8f8}
.field .hint{font-size:10.5px;color:var(--muted);margin-top:3px}
.field .errmsg{font-size:11px;color:var(--dog);margin-top:3px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin-bottom:8px;cursor:pointer}
.chk input{margin-top:3px}
/* misc */
.toast{position:fixed;bottom:22px;right:22px;left:auto;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s;max-width:calc(100vw - 44px)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.quad-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px}
.quad-legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.quads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quad{border-radius:11px;padding:12px 13px;font-size:12px;min-width:0}
.quad .qh{font-weight:600;font-size:12.5px;margin-bottom:3px}
.quad .qr{font-size:11px;opacity:.85;margin-bottom:7px;line-height:1.45}
.quad .chips{display:flex;flex-wrap:wrap;gap:4px}
.quad .chip{background:rgba(255,255,255,.75);border-radius:6px;padding:2px 7px;font-size:11px}
.combo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:16px}
.combo{background:linear-gradient(135deg,#fff7f1,#fff);border:1px solid #ffe1cc;border-radius:13px;padding:15px}
.combo .pair{font-weight:600;font-size:13.5px;margin-bottom:6px}
.combo .stat{font-size:11.5px;color:var(--muted);line-height:1.75}
.combo .stat b{color:var(--ink)}
.sim-grid{display:grid;grid-template-columns:340px 1fr;gap:16px}
.sim-grid>.card{margin-bottom:0}
.impact{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid #f0f2f7;font-size:12.5px;flex-wrap:wrap}
.impact .l{color:var(--muted)}
.impact .arrow{color:var(--muted);margin:0 6px}
.impact.total{font-weight:600;border-bottom:none;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.seg button{border:none;background:var(--card);padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.lock-hero{max-width:640px;margin:20px auto;text-align:center}
.lock-hero .big{font-size:44px;margin-bottom:8px}
.lock-hero h2{font-size:20px;margin-bottom:8px}
.lock-hero p{color:var(--muted);line-height:1.7;margin-bottom:14px}
.lock-list{text-align:left;display:inline-block;margin:6px 0 18px;line-height:2;font-size:13px}
.prio{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.fc-cell{font-weight:600}
.fc-cell small{display:block;font-weight:400;font-size:10px;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.set-grid>.card{margin-bottom:0}
.locked-card{opacity:.7;position:relative}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.steps span{font-size:11.5px;padding:4px 10px;border-radius:20px;background:#eef1f6;color:var(--muted)}
.steps span.on{background:var(--ink);color:#fff}
/* responsive */
@media(max-width:1100px){.grid2,.grid32{grid-template-columns:1fr}}
@media(max-width:1000px){.sim-grid{grid-template-columns:1fr}}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:none}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .main{margin-left:0}
  .hamb{display:block}
  .topbar{padding:10px 14px;flex-wrap:wrap;gap:8px}
  .topbar .ttl{flex-basis:calc(100% - 50px)}
  .topbar .sub{display:none}
  .top-actions{width:100%;justify-content:flex-start}
  .content{padding:14px 12px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 13px}
  .kpi .val{font-size:17px}
  .card{padding:14px 14px}
  .chart-box.tall{height:300px}
  .quads:not(.compact){grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .search{width:100%}
  .toolbar .grp{width:100%}
}
@media print{
  .sidebar,.topbar,.no-print,.banner,.toast{display:none!important}
  .main{margin-left:0}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .tbl-wrap.scroll{max-height:none;overflow:visible}
}
</style>

/* classify a list of {qty, cm} in-place: adds pop, prof, cls. Returns {avgQty, refCM} */
function classifyList(list){
  const M = methodInfo();
  const n = list.length || 1;
  const totQ = list.reduce((a, s) => a + s.qty, 0);
  const avgQty = totQ / n;
  const refCM = M.weighted && totQ > 0 ? list.reduce((a, s) => a + s.cm * s.qty, 0) / totQ : list.reduce((a, s) => a + s.cm, 0) / n;
  list.forEach(s => {
    s.pop = avgQty > 0 ? s.qty / avgQty : 0;
    s.prof = refCM > 0 ? s.cm / refCM : (s.cm > 0 ? 2 : 0);
    s.cls = s.pop >= M.popThresh ? (s.prof >= 1 ? 'STAR' : 'PLOW') : (s.prof >= 1 ? 'PUZZLE' : 'DOG');
  });
  return {avgQty, refCM, popThresh:M.popThresh};
}

  list.forEach(s => { s.cmTotal = s.cm * s.qty; s.fc = s.m.price > 0 ? s.rc / s.m.price : 0; });
  const ref = classifyList(list);
  const tot = {revenue:0, qty:0, cm:0, waste:0};
  list.forEach(s => { tot.revenue += s.revenue; tot.qty += s.qty; tot.cm += s.cmTotal; tot.waste += s.wasteVal; });
  const res = {list, ...ref, tot, R};
  statsCache[key] = res;
  return res;
}

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const cnt = c => (first.match(new RegExp('\\' + c, 'g')) || []).length;
  const delim = [[',', cnt(',')], [';', cnt(';')], ['\t', (first.match(/\t/g) || []).length]].sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== '')).map(r => r.map(x => String(x).trim()));
}
function toCSV(rows){ return '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
function download(name, content, type = 'text/csv;charset=utf-8'){
  const blob = new Blob([content], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
/* accepts 2026-05-01, 01/05/2026, 1/5/2569 (B.E.), 2026/05/01, Excel serials, with optional time.
   d/m/y vs m/d/y is detected per file (detectDateOrder) — Thai default is d/m/y */
let dateOrder = 'dmy';
function detectDateOrder(values){
  let dmy = 0, mdy = 0;
  values.forEach(v => { const mt = String(v || '').trim().split(/[ T]/)[0].match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/); if (!mt) return; if (+mt[1] > 12) dmy++; else if (+mt[2] > 12) mdy++; });
  dateOrder = mdy > dmy ? 'mdy' : 'dmy';
  return dateOrder;
}
function parseDate(v){
  if (v == null) return null; let s = String(v).trim(); if (!s) return null;
  if (/^\d{5}(\.\d+)?$/.test(s)) { const d = new Date(Date.UTC(1899, 11, 30) + parseFloat(s) * 864e5); return d.toISOString().slice(0, 10); }
  s = s.split(/[ T]/)[0];
  let y, m, d, mt;
  if ((mt = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) { y = +mt[1]; m = +mt[2]; d = +mt[3]; }
  else if ((mt = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/))) { if (dateOrder === 'mdy') { m = +mt[1]; d = +mt[2]; } else { d = +mt[1]; m = +mt[2]; } y = +mt[3]; if (y < 100) y = y > 40 ? y + 2500 : y + 2000; }
  else return null;
  if (y > 2400) y -= 543;
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function parseTime(v){ const mt = String(v || '').match(/(\d{1,2}):(\d{2})/); return mt ? mt[1].padStart(2, '0') + ':' + mt[2] : ''; }
const normKey = s => String(s || '').toLowerCase().replace(/[\s_\-().]/g, '');
function findCol(headers, aliases){ const H = headers.map(normKey); for (const a of aliases) { const i = H.indexOf(normKey(a)); if (i >= 0) return i; } for (const a of aliases) { const i = H.findIndex(h => h.includes(normKey(a))); if (i >= 0) return i; } return -1; }

function pickFile(accept, cb){
  const inp = document.getElementById('fileInput');
  inp.accept = accept; inp.value = '';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const buf = new Uint8Array(rd.result); let text;
      /* Excel on Thai Windows saves "CSV" as Windows-874 (TIS-620), not UTF-8 → fall back so Thai names still match */
      try { text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
      catch(err) { try { text = new TextDecoder('windows-874').decode(buf); } catch(e2) { text = new TextDecoder('utf-8').decode(buf); } }
      cb(text, f.name);
    };
    rd.readAsArrayBuffer(f);
  };
  inp.click();
}

const quadPlugin = {

  afterDraw(c, args, o){

    const px = x.getPixelForValue(o.x), py = y.getPixelForValue(o.y);

    ctx.setLineDash([]); ctx.font = '600 11px Prompt, sans-serif'; ctx.globalAlpha = .55;
    const L = [['PUZZLE', a.left + 8, a.top + 16, 'left'], ['STAR', a.right - 8, a.top + 16, 'right'], ['DOG', a.left + 8, a.bottom - 8, 'left'], ['PLOW HORSE', a.right - 8, a.bottom - 8, 'right']];
    L.forEach(([t, xx, yy, al]) => { ctx.fillStyle = CLS_COLOR[t === 'PLOW HORSE' ? 'PLOW' : t]; ctx.textAlign = al; ctx.fillText(t, xx, yy); });
    ctx.restore();

};

function deltaHtml(curV, prevV, invert = false, isPct = false){
  if (prevV == null || !isFinite(prevV)) return '';
  if (isPct) { const d = curV - prevV; if (Math.abs(d) < 1e-9) return '<span class="neutral">±0</span>'; const good = (d > 0) !== invert; return `<span class="${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d) * 100, 1)} pp</span>`; }
  if (!prevV) return '';
  const d = (curV - prevV) / Math.abs(prevV); const good = (d > 0) !== invert;
  return `<span class="${Math.abs(d) < .0005 ? 'neutral' : good ? 'up' : 'down'}">${d > 0 ? '▲' : d < 0 ? '▼' : ''} ${fmt(Math.abs(d) * 100, 1)}%</span>`;
}

let simChart = null;
function simCalc(){
  const R = currentRange(); const m = menuById(simMenuId);
  const st = calcStats(R); const s = st.list.find(x => x.m.id === m.id);
  const row = (lab, a, b, f, invert = false) => { const d = b - a; const cl = Math.abs(d) < 1e-9 ? 'neutral' : (d > 0 !== invert ? 'up' : 'down');
    return `<div class="impact"><span class="l">${lab}</span><span>${f(a)}<span class="arrow">→</span><b>${f(b)}</b> <span class="${cl}">${Math.abs(d) < 1e-9 ? '' : (d > 0 ? '▲' : '▼') + ' ' + f(Math.abs(d))}</span></span></div>`; };
  let labels, curV, newV;
  if (simMode === 'adjust') {
    const nPrice = +document.getElementById('simPrice').value || 0, nCost = +document.getElementById('simCost').value || 0;
    const nWaste = (+document.getElementById('simWaste').value || 0) / 100, qChg = (+document.getElementById('simQtyChg').value || 0) / 100;
    const cu = {rc:s.rc, cm:s.cm, mg:marginOf(m), qty:s.qty, cls:s.cls}; cu.total = cu.cm * cu.qty; cu.rev = m.price * cu.qty;
    const nu = {rc:nCost * (1 + nWaste)}; nu.cm = nPrice - nu.rc; nu.mg = nPrice > 0 ? nu.cm / nPrice : 0; nu.qty = Math.round(s.qty * (1 + qChg)); nu.total = nu.cm * nu.qty; nu.rev = nPrice * nu.qty;
    const L2 = st.list.map(x => ({id:x.m.id, qty:x.m.id === m.id ? nu.qty : x.qty, cm:x.m.id === m.id ? nu.cm : x.cm}));
    classifyList(L2); nu.cls = L2.find(x => x.id === m.id).cls;
    document.getElementById('simOut').innerHTML =
      row(tt('ต้นทุนจริง/จาน','Real cost/dish'), cu.rc, nu.rc, x => fmtB(x, 2), true) + row(tt('CM/จาน','CM/dish'), cu.cm, nu.cm, x => fmtB(x, 2)) +
      row('Margin %', cu.mg, nu.mg, x => pct(x, 1)) + row('Food cost %', cu.rc / m.price, nPrice ? nu.rc / nPrice : 0, x => pct(x, 1), true) +
      row(tt('รายรับ (ช่วงที่เลือก)','Revenue (period)'), cu.rev, nu.rev, x => fmtB(x)) + row(tt('กำไร CM (ช่วงที่เลือก)','CM profit (period)'), cu.total, nu.total, x => fmtB(x)) +
      `<div class="impact"><span class="l">${tt('กลุ่ม Matrix','Matrix class')}</span><span><span class="tag ${cu.cls}">${CLS_LABEL[cu.cls]}</span><span class="arrow">→</span><span class="tag ${nu.cls}">${CLS_LABEL[nu.cls]}</span></span></div>` +
      `<div class="impact total"><span>${tt('กำไรเปลี่ยน ต่อ 30 วัน','Profit change per 30 days')}</span><span class="${nu.total >= cu.total ? 'up' : 'down'}">${fmtSigned((nu.total - cu.total) * 30 / R.days)}</span></div>`;
    labels = [tt('รายรับ','Revenue'), tt('กำไร CM','CM profit')]; curV = [cu.rev, cu.total]; newV = [nu.rev, nu.total];
  } else {
    const rec = Math.min(100, Math.max(0, +document.getElementById('simRecap').value || 0)) / 100;
    const others = st.list.filter(x => x.m.id !== m.id); const oq = others.reduce((a, x) => a + x.qty, 0);
    const avgCMo = oq ? others.reduce((a, x) => a + x.cm * x.qty, 0) / oq : 0;
    const lost = s.cmTotal, regained = s.qty * rec * avgCMo, saved = s.wasteVal, netI = -lost + regained + saved;
    const k = 30 / R.days;
    document.getElementById('simOut').innerHTML =
      `<div class="impact"><span class="l">${tt('กำไร CM ที่เสียไปจากเมนูนี้','CM lost from this menu')}</span><span class="down">−${fmtB(lost * k)}</span></div>` +
      `<div class="impact"><span class="l">${tt('กำไรที่ได้คืนจากลูกค้าที่สั่งเมนูอื่นแทน','CM regained from switching customers')} (${Math.round(rec * 100)}% × ${tt('CM เฉลี่ย','avg CM')} ${fmtB(avgCMo, 2)})</span><span class="up">+${fmtB(regained * k)}</span></div>` +
      `<div class="impact"><span class="l">${tt('ของเสียที่ไม่เกิดอีก','Waste avoided')}</span><span class="up">+${fmtB(saved * k)}</span></div>` +
      `<div class="impact total"><span>${tt('ผลสุทธิ ต่อ 30 วัน','Net impact per 30 days')}</span><span class="${netI >= 0 ? 'up' : 'down'}">${fmtSigned(netI * k)}</span></div>` +
      `<div class="note" style="margin-top:12px">${netI >= 0 ? '✅ ' + tt('ตัดออกแล้วกำไรรวมไม่ลด — น่าพิจารณาตัดออก (และลดความซับซ้อนในครัว)','Removing it does not hurt profit — worth considering (also simplifies the kitchen)') : '⚠️ ' + tt('ตัดออกแล้วกำไรรวมลดลง ถ้าจะตัดต้องมีลูกค้าย้ายไปสั่งเมนูอื่นอย่างน้อย','Removing it lowers profit — it needs at least') + ' ' + pct(avgCMo ? Math.min(1, (lost - saved) / (s.qty * avgCMo)) : 1, 0) + ' ' + tt('จึงจะคุ้ม','of customers switching to break even')}</div>`;
    labels = [tt('ต่อ 30 วัน','Per 30 days')]; curV = [0]; newV = [netI * k];
  }
  if (simChart) { try { simChart.destroy(); } catch(e) {} charts = charts.filter(c => c !== simChart); }
  simChart = newChart('chSim', simMode === 'adjust'
    ? {type:'bar', data:{labels, datasets:[{label:tt('ปัจจุบัน','Current'), data:curV, backgroundColor:'#94a3b8b3', borderRadius:5}, {label:'Scenario', data:newV, backgroundColor:'#ff7a30cc', borderRadius:5}]},
       options:{maintainAspectRatio:false, plugins:{legend:{labels:{boxWidth:12, font:{size:11}}}}, scales:{y:{beginAtZero:true, ticks:{font:baseFont}}}}}
    : {type:'bar', data:{labels, datasets:[{label:tt('ผลสุทธิ','Net impact'), data:newV, backgroundColor:newV[0] >= 0 ? '#16a34acc' : '#dc2626cc', borderRadius:5}]},
       options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:baseFont}}}}});
}

function sortBy(key){ dataSort = dataSort.key === key ? {key, dir:-dataSort.dir} : {key, dir:1}; renderDataTable(); }
const arrow = key => dataSort.key === key ? (dataSort.dir > 0 ? ' ▲' : ' ▼') : '';
const thS = (key, label, cls = '') => `<th class="sortable ${cls}" onclick="sortBy('${key}')">${label}${arrow(key)}</th>`;
function sortRows(rows, getter, defKey, defDir){
  const key = dataSort.key || defKey, dir = dataSort.key ? dataSort.dir : defDir;
  return [...rows].sort((a, b) => { const va = getter(a, key), vb = getter(b, key); return (va > vb ? 1 : va < vb ? -1 : 0) * dir; });
}
function renderDataTable(){
  const q = dataSearch.toLowerCase().trim(); let rows, head, body;

      <td class="num">${fmt(m.wastePct * 100, 1)}%</td><td class="num">${fmt(realCost(m), 2)}</td><td class="num">${pct(marginOf(m))}</td>

    rows = sortRows(rows, (s, k) => { const m = menuById(s.menuId); return k === 'val' ? (m ? (dataTab === 'sales' ? m.price : realCost(m)) * s.qty : 0) : k === 'date' ? s.date + String(s.id).padStart(8, '0') : s[k]; }, 'date', -1);

    body = pageRows(rows).map(s => { const m = menuById(s.menuId);
      return `<tr><td>${dispDate(s.date)}</td><td>${m ? esc(mName(m)) : '<span class="down">' + tt('ไม่พบเมนู','Unknown') + '</span>'} <span class="sub-txt">${esc(s.menuId)}</span></td><td class="num">${fmt(s.qty)}</td>

  }
    document.getElementById('dataTable').innerHTML = tableShell(rows.length, head, body);

function pageRows(rows){ return rows.slice((dataPage - 1) * PAGE_SIZE, dataPage * PAGE_SIZE); }
function tableShell(total, thead, tbody){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (dataPage > pages) dataPage = pages;
  return `<div class="tbl-wrap"><table><thead>${thead}</thead><tbody>${tbody || `<tr><td colspan="9" class="empty">${tt('ไม่พบข้อมูล','No records')}</td></tr>`}</tbody></table></div>

  <button class="btn sm" ${dataPage >= pages ? 'disabled' : ''} onclick="dataPage++;renderDataTable()">${tt('ถัดไป','Next')} ›</button></div>`;
}

function fieldErr(id, msg){ const el = document.getElementById(id); if (!el) return; el.classList.add('err'); const p = el.parentElement; if (!p.querySelector('.errmsg')) p.insertAdjacentHTML('beforeend', `<div class="errmsg">${msg}</div>`); }
function clearErr(){ document.querySelectorAll('.modal .err').forEach(e => e.classList.remove('err')); document.querySelectorAll('.modal .errmsg').forEach(e => e.remove()); }
function submitForm(kind, id){
  clearErr();
  const v = x => document.getElementById(x)?.value ?? ''; let ok = true;
  if (kind === 'menu') {
    const name = v('f_name').trim(), price = +v('f_price'), costEl = document.getElementById('f_cost'), cost = +v('f_cost');
    if (!name) { fieldErr('f_name', tt('กรุณากรอกชื่อเมนู','Name is required')); ok = false; }
    else if (db.menu.some(x => x.name.trim().toLowerCase() === name.toLowerCase() && x.id !== id)) { fieldErr('f_name', tt('มีเมนูชื่อนี้แล้ว','A menu with this name exists')); ok = false; }
    if (!(price > 0)) { fieldErr('f_price', tt('ราคาต้องมากกว่า 0','Price must be > 0')); ok = false; }
    if (!costEl.disabled && (v('f_cost') === '' || !(cost >= 0))) { fieldErr('f_cost', tt('กรุณากรอกต้นทุน (0 ขึ้นไป)','Enter a cost ≥ 0')); ok = false; }
    const wp = +v('f_waste'); if (!(wp >= 0 && wp < 100)) { fieldErr('f_waste', '0–99'); ok = false; }
    if (!ok) return;
    const rec = {name, nameEn:v('f_nameEn').trim(), cat:v('f_cat'), price, prep:+v('f_prep') || 0, wastePct:wp / 100};
    if (!costEl.disabled) rec.cost = cost;
    if (id) Object.assign(menuById(id), rec); else db.menu.push({id:nextMenuId(), cost:0, ...rec});
  } else {
    const date = v('f_date'), qty = +v('f_qty');
    if (!date) { fieldErr('f_date', tt('กรุณาเลือกวันที่','Pick a date')); ok = false; }
    if (!(qty > 0) || !Number.isInteger(qty)) { fieldErr('f_qty', tt('จำนวนต้องเป็นจำนวนเต็มมากกว่า 0','Whole number > 0')); ok = false; }
    if (!ok) return;
    const rec = {date, menuId:v('f_menu'), qty}; if (kind === 'waste') rec.reason = v('f_reason');
    const arr = db[kind];
    if (id) Object.assign(arr.find(x => x.id === id), rec);
    else { const ex = kind === 'sales' ? arr.find(x => x.date === date && x.menuId === rec.menuId) : null; if (ex) ex.qty += qty; else arr.push({id:nextLogId(arr), ...rec}); }
  }
  if (db.isSample) db.isSample = false;
  saveDB(); closeModal(); toast(tt('บันทึกแล้ว ✓','Saved ✓')); render();
}
function delRow(kind, id){
  if (kind === 'menu') {
    const n = db.sales.filter(s => s.menuId === id).length + db.waste.filter(w => w.menuId === id).length;
    askConfirm(tt(`ลบเมนูนี้? รายการยอดขายและของเสียที่เกี่ยวข้อง ${fmt(n)} รายการจะถูกลบด้วย`, `Delete this menu? ${fmt(n)} related sales & waste records will also be removed.`), () => {
      db.menu = db.menu.filter(m => m.id !== id); db.sales = db.sales.filter(s => s.menuId !== id); db.waste = db.waste.filter(w => w.menuId !== id);
      if (PRO) { delete db.recipes[id]; db.bills.forEach(b => b.items = b.items.filter(i => i.menuId !== id)); db.bills = db.bills.filter(b => b.items.length); }
      saveDB(); toast(tt('ลบแล้ว','Deleted')); render(); }, tt('ลบ','Delete'));
  } else askConfirm(tt('ลบรายการนี้?','Delete this record?'), () => { db[kind] = db[kind].filter(x => x.id !== id); saveDB(); toast(tt('ลบแล้ว','Deleted')); renderDataTable(); render(); }, tt('ลบ','Delete'));
}

const CSV_SPEC = {
  menu:  {cols:['id','name','name_en','category','price','cost','prep_min','prep_loss_pct'], sample:[['M001','ข้าวผัดกุ้ง','Shrimp Fried Rice','อาหารจานเดียว',120,45,8,5]]},
  sales: {cols:['date','menu','qty'], sample:[['2026-10-01','M001',14], ['01/10/2026','ผัดไทยกุ้งสด',11]]},
  waste: {cols:['date','menu','qty','reason'], sample:[['2026-10-01','M003',2,'เตรียมเกิน']]},
  bills: {cols:['bill_no','date','time','item','qty'], sample:[['B0001','2026-10-01','12:31','ส้มตำไทย',1], ['B0001','2026-10-01','12:31','ไก่ทอดหาดใหญ่',1], ['B0002','2026-10-01','12:40','M011',2]]},
};
function downloadTemplate(kind){ const sp = CSV_SPEC[kind]; download(`template_${kind}.csv`, toCSV([sp.cols, ...sp.sample])); }
function exportCSV(kind){
  let rows;
  if (kind === 'menu') rows = [CSV_SPEC.menu.cols, ...db.menu.map(m => [m.id, m.name, m.nameEn || '', m.cat, m.price, +costOf(m).toFixed(2), m.prep || 0, +(m.wastePct * 100).toFixed(2)])];
  if (kind === 'sales') rows = [['date','menu_id','menu_name','qty','revenue'], ...db.sales.map(s => { const m = menuById(s.menuId); return [s.date, s.menuId, m ? m.name : '', s.qty, m ? m.price * s.qty : '']; })];
  if (kind === 'waste') rows = [['date','menu_id','menu_name','qty','reason','value'], ...db.waste.map(w => { const m = menuById(w.menuId); return [w.date, w.menuId, m ? m.name : '', w.qty, w.reason, m ? +(realCost(m) * w.qty).toFixed(2) : '']; })];
  if (kind === 'bills') { rows = [['bill_no','date','time','menu_id','menu_name','qty']]; db.bills.forEach(b => b.items.forEach(i => rows.push([b.no, b.date, b.time || '', i.menuId, menuById(i.menuId)?.name || '', i.qty]))); }
  download(`${kind}_${todayISO()}.csv`, toCSV(rows));
}
function importCSV(kind){
  if (demoBlocked()) return;
  pickFile('.csv,.txt', text => {
    const rows = parseCSV(text); if (rows.length < 2) { toast(tt('ไฟล์ว่างหรืออ่านไม่ได้','File is empty or unreadable')); return; }
    const H = rows[0]; const data = rows.slice(1); let added = 0, updated = 0; const skipped = [];
    const col = a => findCol(H, a);
    if (kind === 'menu') {
      const c = {id:col(['id','menu_id','รหัส']), name:col(['name','ชื่อเมนู','ชื่อ','menu']), en:col(['name_en','nameen','english']), cat:col(['category','หมวด','cat']), price:col(['price','ราคา']), cost:col(['cost','ต้นทุน']), prep:col(['prep_min','prep','เวลา']), loss:col(['prep_loss_pct','loss','waste','สูญเสีย'])};
      if (c.name < 0 || c.price < 0) { toast(tt('ต้องมีคอลัมน์ name และ price','Columns "name" and "price" are required'), 3500); return; }
      data.forEach((r, i) => {
        const name = r[c.name], price = num(r[c.price]); if (!name || !(price > 0)) { skipped.push(i + 2); return; }
        const rec = {name, nameEn:c.en >= 0 ? r[c.en] : '', cat:c.cat >= 0 && r[c.cat] ? r[c.cat] : S().categories[0], price, cost:c.cost >= 0 ? (num(r[c.cost]) || 0) : 0, prep:c.prep >= 0 ? (num(r[c.prep]) || 0) : 0, wastePct:c.loss >= 0 ? (num(r[c.loss]) || 0) / 100 : 0.05};
        const ex = (c.id >= 0 && r[c.id] && menuById(r[c.id])) || db.menu.find(m => m.name === name);
        if (ex) { Object.assign(ex, rec); updated++; } else { db.menu.push({id:(c.id >= 0 && r[c.id]) || nextMenuId(), ...rec}); added++; }
        if (rec.cat && !S().categories.includes(rec.cat)) S().categories.push(rec.cat);
      });
    } else {
      const c = {date:col(['date','วันที่']), menu:col(['menu','menu_id','item','เมนู','รายการ','สินค้า','name']), qty:col(['qty','quantity','จำนวน']), reason:col(['reason','สาเหตุ'])};
      if (c.date < 0 || c.menu < 0) { toast(tt('ต้องมีคอลัมน์ date และ menu','Columns "date" and "menu" are required'), 3500); return; }
      const arr = db[kind];
      detectDateOrder(data.map(r => r[c.date]));
      data.forEach((r, i) => {
        const date = parseDate(r[c.date]), m = matchMenu(r[c.menu]), qty = c.qty >= 0 ? num(r[c.qty]) : 1;
        if (!date || !m || !(qty > 0)) { skipped.push(i + 2); return; }
        if (kind === 'sales') { const ex = arr.find(x => x.date === date && x.menuId === m.id); if (ex) { ex.qty = qty; updated++; } else { arr.push({id:nextLogId(arr), date, menuId:m.id, qty}); added++; } }
        else { const reason = (c.reason >= 0 && r[c.reason]) || S().reasons[0]; if (!S().reasons.includes(reason)) S().reasons.push(reason); arr.push({id:nextLogId(arr), date, menuId:m.id, qty, reason}); added++; }
      });
    }
    db.isSample = false; saveDB(); render();
    openModal(`<h3>${tt('นำเข้าเสร็จแล้ว','Import complete')}</h3><p style="line-height:1.9;font-size:13px">✅ ${tt('เพิ่มใหม่','Added')} <b>${fmt(added)}</b> · 🔁 ${tt('อัปเดต','Updated')} <b>${fmt(updated)}</b> · ⚠️ ${tt('ข้าม','Skipped')} <b>${fmt(skipped.length)}</b></p>
      ${skipped.length ? `<div class="note">${tt('แถวที่ข้าม (วันที่/เมนู/จำนวนไม่ถูกต้อง หรือหาเมนูไม่พบ)','Skipped rows (invalid date/menu/qty or menu not found)')}: ${skipped.slice(0, 30).join(', ')}${skipped.length > 30 ? '…' : ''}</div>` : ''}
      ${kind === 'sales' ? `<p class="sub-txt">${tt('ถ้ามีวันที่และเมนูซ้ำกับข้อมูลเดิม ระบบจะแทนที่จำนวนเดิม (ไม่บวกซ้ำ)','Rows matching an existing date + menu replace the old quantity (no double counting)')}</p>` : ''}
      <div class="modal-actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
  });
}

/* ================= basket analysis (real bills) ================= */
function pairStats(R){
  const key = R.from + R.to;
  if (billsCache && billsCache.key === key) return billsCache.val;
  const bills = db.bills.filter(b => inR(b.date, R)).map(b => [...new Set(b.items.map(i => i.menuId))].filter(id => menuById(id)));
  const N = bills.length; const cnt = {}, single = {};
  bills.forEach(b => { b.forEach(x => single[x] = (single[x] || 0) + 1);
    for (let i = 0; i < b.length; i++) for (let j = i + 1; j < b.length; j++) { const k = [b[i], b[j]].sort().join('|'); cnt[k] = (cnt[k] || 0) + 1; } });
  const minC = Math.max(3, Math.round(N * 0.005));
  const pairs = Object.entries(cnt).filter(([, c]) => c >= minC).map(([k, c]) => { const [a, b] = k.split('|');
    return {a, b, count:c, support:c / N, confAB:c / single[a], confBA:c / single[b], lift:(c * N) / (single[a] * single[b])}; }).sort((x, y) => y.lift - x.lift);
  const val = {pairs, N, single, cnt};
  billsCache = {key, val};
  return val;
}

/* ================= action plan ================= */
function buildActions(R){
  const st = calcStats(R); const {list, popThresh, avgQty, tot} = st; const s = S();
  const k = 30 / R.days; const acts = [];
  const target = s.targetFC, vol = s.volLoss, recap = s.recapture;
  const pairs = db.bills.length ? pairStats(R).pairs : [];
  const clsOf = id => list.find(x => x.m.id === id)?.cls;
  const reprice = (x, newPrice) => { const nq = x.qty * (1 - vol); return ((newPrice - x.rc) * nq - x.cm * x.qty) * k; };
  list.forEach(x => {
    const m = x.m; const fc = x.fc;
    const priceTarget = round5up(x.rc / target);
    if (x.cls === 'DOG') {
      const others = list.filter(o => o !== x), oq = others.reduce((a, o) => a + o.qty, 0), avgO = oq ? others.reduce((a, o) => a + o.cm * o.qty, 0) / oq : 0;
      const removeI = (-x.cmTotal + x.qty * recap * avgO + x.wasteVal) * k;
      const np = Math.min(priceTarget, round5up(m.price * 1.15));
      const repI = np > m.price ? reprice(x, np) : 0;
      if (removeI >= repI && removeI > 0) acts.push({m, cls:x.cls, type:'remove', impact:removeI, kind:'est',
        th:`ตัดออกจากเมนู`, en:`Remove from menu`, dTh:`ขาย ${fmt(x.qty)} จาน CM ${fmtB(x.cm, 0)}/จาน · สมมติลูกค้า ${Math.round(recap * 100)}% ย้ายไปสั่งเมนูอื่น`, dEn:`Sold ${fmt(x.qty)} · CM ${fmtB(x.cm, 0)}/dish · assumes ${Math.round(recap * 100)}% switch to other items`});
      else if (repI > 0) acts.push({m, cls:x.cls, type:'price', impact:repI, kind:'est', newPrice:np,
        th:`ปรับสูตร/ขึ้นราคา ${fmtB(m.price)} → ${fmtB(np)}`, en:`Rework / reprice ${fmtB(m.price)} → ${fmtB(np)}`, dTh:`Food cost ${pct(fc)} (เป้า ${pct(target, 0)}) · ถ้าไม่ดีขึ้นใน 1–2 เดือนให้ตัดออก`, dEn:`Food cost ${pct(fc)} (target ${pct(target, 0)}) · remove if no improvement in 1–2 months`});
      else acts.push({m, cls:x.cls, type:'watch', impact:0, kind:'info', th:'เฝ้าดู — ตัดออกแล้วกำไรรวมลดลง', en:'Watch — removing it would lower total profit', dTh:'ลองโปรโมทหรือย้ายตำแหน่งในเมนูก่อน', dEn:'Try promotion or a better menu position first'});
    } else if (x.cls === 'PLOW') {
      let np = fc > target ? Math.min(priceTarget, round5up(m.price * 1.10)) : round5up(m.price * 1.05);
      if (np <= m.price) np = m.price + 5;
      const imp = reprice(x, np);
      acts.push({m, cls:x.cls, type:'price', impact:imp, kind:'est', newPrice:np,
        th:`ขึ้นราคา ${fmtB(m.price)} → ${fmtB(np)}`, en:`Raise price ${fmtB(m.price)} → ${fmtB(np)}`,
        dTh:`ขายดีอยู่แล้ว (${fmt(x.qty)} จาน) · Food cost ${pct(fc)} · คิดเผื่อยอดลด ${Math.round(vol * 100)}% · หรือลดต้นทุน/ปริมาณแทน`, dEn:`Already popular (${fmt(x.qty)}) · food cost ${pct(fc)} · assumes ${Math.round(vol * 100)}% volume loss · or trim cost/portion instead`});
    } else if (x.cls === 'PUZZLE') {
      const need = Math.max(0, Math.ceil(popThresh * avgQty - x.qty));
      const partner = pairs.filter(p => (p.a === m.id || p.b === m.id) && p.lift > 1).map(p => p.a === m.id ? p.b : p.a).find(id => ['STAR','PLOW'].includes(clsOf(id)));
      acts.push({m, cls:x.cls, type:'promote', impact:need * x.cm * k, kind:'pot',
        th:partner ? `โปรโมท + จัด Combo กับ ${mName(menuById(partner))}` : 'โปรโมท / ให้พนักงานแนะนำ / ย้ายไปตำแหน่งเด่น', en:partner ? `Promote + bundle with ${mName(menuById(partner))}` : 'Promote / staff upsell / prime menu spot',
        dTh:`กำไรดี (CM ${fmtB(x.cm, 0)}/จาน) แต่ขายน้อย · ต้องขายเพิ่ม ${fmt(need)} จานในช่วงนี้จึงจะเป็น STAR`, dEn:`Profitable (CM ${fmtB(x.cm, 0)}) but under-ordered · needs ${fmt(need)} more sales in this period to become a STAR`});
    } else {
      if (fc > target + 0.05) acts.push({m, cls:x.cls, type:'cost', impact:0, kind:'info', th:'รักษาไว้ — แต่ตรวจต้นทุน', en:'Keep — but review cost', dTh:`Food cost ${pct(fc)} สูงกว่าเป้า`, dEn:`Food cost ${pct(fc)} above target`});
      else acts.push({m, cls:x.cls, type:'keep', impact:0, kind:'info', th:'รักษามาตรฐาน วางตำแหน่งเด่น', en:'Protect: keep quality & prime position', dTh:`ดาวเด่นของร้าน · รายรับ ${fmtB(x.revenue)}`, dEn:`Signature item · revenue ${fmtB(x.revenue)}`});
    }
    const wr = x.revenue > 0 ? x.wasteVal / x.revenue : 0;
    if (wr > s.wasteFlag && x.wasteVal > 0) {
      const avoidable = db.waste.filter(w => w.menuId === m.id && inR(w.date, R) && (isOverPrep(w.reason) || /หมดอายุ|expire/i.test(w.reason))).reduce((a, w) => a + w.qty * x.rc, 0);
      acts.push({m, cls:x.cls, type:'waste', impact:(avoidable || x.wasteVal * 0.5) * k, kind:'pot', th:'ลดของเสีย — ปรับปริมาณเตรียมตามพยากรณ์', en:'Cut waste — prep to forecast',
        dTh:`ของเสีย ${pct(wr, 1)} ของรายรับ (เกณฑ์ ${pct(s.wasteFlag, 1)}) · ส่วนที่ป้องกันได้ (เตรียมเกิน/หมดอายุ)`, dEn:`Waste ${pct(wr, 1)} of revenue (flag ${pct(s.wasteFlag, 1)}) · avoidable part (over-prep/expired)`});
    }
  });
  return acts.sort((a, b) => b.impact - a.impact);
}

/* ================= prep forecast ================= */
const Z_OF = {0.5:0, 0.7:0.524, 0.8:0.842, 0.9:1.282, 0.95:1.645};
function salesMatrix(){
  const open = [...new Set(db.sales.map(s => s.date))].sort();
  const q = {}; db.menu.forEach(m => q[m.id] = {});
  db.sales.forEach(s => { if (q[s.menuId]) q[s.menuId][s.date] = (q[s.menuId][s.date] || 0) + s.qty; });
  return {open, q};
}
function fcStats(vals){ const n = vals.length; if (!n) return {mu:0, sd:0, n}; const mu = vals.reduce((a, b) => a + b, 0) / n; const sd = n > 1 ? Math.sqrt(vals.reduce((a, b) => a + (b - mu) ** 2, 0) / (n - 1)) : Math.sqrt(mu); return {mu, sd, n}; }
function forecastFor(mid, targetDate, open, q, weeks, beforeDate){
  const dow = dowOf(targetDate);
  const hist = open.filter(d => d < (beforeDate || targetDate) && dowOf(d) === dow).slice(-weeks);
  return fcStats(hist.map(d => q[mid][d] || 0));
}
PAGE_FN.forecast = function(){
  const el = document.getElementById('content');
  if (!db.menu.length || !db.sales.length) { el.innerHTML = needData({from:null}); return; }
  const s = S(); const weeks = s.fcWeeks, z = Z_OF[s.fcLevel] ?? 0.842;
  const {open, q} = salesMatrix(); const last = open[open.length - 1];
  const span = dayDiff(open[0], last) + 1;
  const days = Array.from({length:7}, (_, i) => isoAdd(last, i + 1));
  const rows = db.menu.map(m => ({m, f:days.map(d => { const st = forecastFor(m.id, d, open, q, weeks); return {...st, prep:Math.ceil(st.mu + z * st.sd)}; })}));
  // back-test on last 7 open days
  const bt = open.slice(-7); let errF = 0, errN = 0, act = 0, biasF = 0;
  bt.forEach(d => db.menu.forEach(m => {
    const a = q[m.id][d] || 0; const f = forecastFor(m.id, d, open, q, weeks, d).mu;
    const prev = open.filter(x => x < d).slice(-28); const naive = prev.length ? prev.reduce((t, x) => t + (q[m.id][x] || 0), 0) / prev.length : 0;
    errF += Math.abs(a - f); errN += Math.abs(a - naive); act += a; biasF += f - a; }));
  const wapeF = act ? errF / act : 0, wapeN = act ? errN / act : 0;
  const dowTot = [0, 0, 0, 0, 0, 0, 0], dowCnt = [0, 0, 0, 0, 0, 0, 0];
  open.slice(-weeks * 7).forEach(d => { dowCnt[dowOf(d)]++; db.menu.forEach(m => dowTot[dowOf(d)] += q[m.id][d] || 0); });
  const overVal = db.waste.filter(w => w.date > isoAdd(last, -28) && isOverPrep(w.reason)).reduce((a, w) => { const m = menuById(w.menuId); return a + (m ? w.qty * realCost(m) : 0); }, 0);
  el.innerHTML = `
  ${span < 14 ? `<div class="banner warn">⚠️ ${tt('มีข้อมูลยอดขายเพียง ' + span + ' วัน — ควรมีอย่างน้อย 2–4 สัปดาห์เพื่อให้พยากรณ์แม่นขึ้น','Only ' + span + ' days of sales — 2–4 weeks are recommended for a reliable forecast')}</div>` : ''}
  <div class="kpis">
    <div class="kpi"><div class="lab">${tt('ความแม่นยำย้อนหลัง 7 วัน','Back-test accuracy (7 days)')}</div><div class="val">${pct(Math.max(0, 1 - wapeF), 0)}</div><div class="delta">${tt('ค่าคลาดเคลื่อน (WAPE)','error (WAPE)')} ${pct(wapeF, 0)} · ${tt('แบบค่าเฉลี่ยธรรมดา','naive average')} ${pct(wapeN, 0)}</div></div>
    <div class="kpi"><div class="lab">${tt('ระดับความพอเพียง','Service level')}</div><div class="val">${Math.round(s.fcLevel * 100)}%</div><div class="delta">${tt('โอกาสที่ของจะไม่หมดก่อนปิดร้าน','chance of not running out')}</div></div>
    <div class="kpi"><div class="lab">${tt('ของเสียจากเตรียมเกิน (28 วันล่าสุด)','Over-prep waste (last 28 days)')}</div><div class="val" style="color:var(--dog)">${fmtB(overVal)}</div><div class="delta">${tt('เป้าหมายที่พยากรณ์ช่วยลด','what the forecast helps cut')}</div></div>
  </div>
  <div class="note">📐 ${tt('วิธีคำนวณ: ค่าเฉลี่ยยอดขายของวันเดียวกันในสัปดาห์ ย้อนหลัง','Method: average sales on the same weekday over the last')} <b>${weeks}</b> ${tt('สัปดาห์ + ค่าเผื่อ','weeks + a buffer of')} ${fmt(z, 2)} × ${tt('ส่วนเบี่ยงเบนมาตรฐาน (ตามระดับความพอเพียง)','standard deviation (from the service level)')} · ${tt('ข้อมูลล่าสุด','latest data')} ${dispDate(last)} — <a href="#" onclick="go('settings');return false">${tt('ปรับได้ในตั้งค่า','adjust in Settings')}</a></div>
  <div class="card"><div class="card-head"><div><h3>${tt('จำนวนที่แนะนำให้เตรียม (จาน)','Suggested prep quantity (portions)')}</h3><div class="desc" style="margin:0">${tt('ตัวเลขเล็ก = ค่าพยากรณ์เฉลี่ย · ใช้เป็นจุดเริ่มต้นแล้วปรับตามประสบการณ์ครัว','Small number = mean forecast · use as a starting point and adjust with kitchen experience')}</div></div>
    <div class="grp no-print" style="display:flex;gap:6px"><button class="btn sm" onclick="exportPrepCSV()">⬇ CSV</button><button class="btn sm dark" onclick="window.print()">🖨️ ${tt('พิมพ์ใบเตรียมของ','Print prep sheet')}</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>${tt('เมนู','Menu')}</th>${days.map(d => `<th class="num">${dowName(dowOf(d))}<div class="sub-txt">${shortDate(d)}</div></th>`).join('')}<th class="num">${tt('รวม','Total')}</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(mName(r.m))}</td>${r.f.map(c => `<td class="num fc-cell">${fmt(c.prep)}<small>${fmt(c.mu, 1)}</small></td>`).join('')}<td class="num"><b>${fmt(r.f.reduce((a, c) => a + c.prep, 0))}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><td>${tt('รวม','Total')}</td>${days.map((d, i) => `<td class="num">${fmt(rows.reduce((a, r) => a + r.f[i].prep, 0))}</td>`).join('')}<td class="num">${fmt(rows.reduce((a, r) => a + r.f.reduce((x, c) => x + c.prep, 0), 0))}</td></tr></tfoot></table></div></div>
  <div class="card no-print"><h3>${tt('ยอดขายเฉลี่ยตามวันในสัปดาห์','Average dishes by weekday')}</h3><div class="desc">${tt('ย้อนหลัง','Last')} ${weeks} ${tt('สัปดาห์ (ทุกเมนูรวมกัน)','weeks (all menus)')}</div><div class="chart-box short"><canvas id="chDow"></canvas></div></div>`;
  window._prepRows = {rows, days};
  const order = [1, 2, 3, 4, 5, 6, 0];
  newChart('chDow', {type:'bar', data:{labels:order.map(dowName), datasets:[{data:order.map(i => dowCnt[i] ? dowTot[i] / dowCnt[i] : 0), backgroundColor:order.map(i => i === 5 || i === 6 || i === 0 ? '#ff7a30cc' : '#94a3b8b3'), borderRadius:5}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => fmt(c.raw, 0) + ' ' + tt('จาน','dishes')}}}, scales:{y:{beginAtZero:true, ticks:{font:baseFont}}}}});
};

  download(`prep_forecast_${days[0]}.csv`, toCSV([['menu', ...days], ...rows.map(r => [r.m.name, ...r.f.map(c => c.prep)])]));

  const m = menuById(recipeDraft.mid);
  if (del) { m.cost = +(recipeCost(m.id) || m.cost).toFixed(2); delete db.recipes[recipeDraft.mid]; }
  else { const rows = recipeDraft.rows.filter(r => ingById(r.ingId) && +r.qty > 0); if (!rows.length) { toast(tt('กรุณาใส่ปริมาณอย่างน้อย 1 วัตถุดิบ','Enter a quantity for at least one ingredient')); return; } db.recipes[recipeDraft.mid] = rows; m.cost = +recipeCost(m.id).toFixed(2); }
  db.isSample = false; saveDB(); closeModal(); toast(tt('บันทึกแล้ว ✓','Saved ✓')); render();
}
function openIng(id){
  const i = id ? ingById(id) : {name:'', nameEn:'', unit:'กก.', price:''};
  openModal(`<h3>${id ? tt('แก้ไขวัตถุดิบ','Edit ingredient') : tt('เพิ่มวัตถุดิบ','Add ingredient')}</h3>
    <div class="frow"><div class="field"><label>${tt('ชื่อ','Name')} *</label><input id="i_name" value="${esc(i.name)}"></div><div class="field"><label>${tt('ชื่อ (อังกฤษ)','Name (EN)')}</label><input id="i_en" value="${esc(i.nameEn || '')}"></div></div>
    <div class="frow"><div class="field"><label>${tt('หน่วยซื้อ','Unit')} *</label><input id="i_unit" value="${esc(i.unit)}" list="unitList"><datalist id="unitList">${['กก.','กรัม','ลิตร','มล.','ฟอง','ลูก','ชิ้น','แพ็ค','ที่'].map(u => `<option value="${u}">`).join('')}</datalist></div>
    <div class="field"><label>${tt('ราคาต่อหน่วย','Price per unit')} (${esc(cur())}) *</label><input id="i_price" type="number" min="0" step="any" value="${i.price}" oninput="ingImpact('${id ? jsq(id) : ''}')"></div></div>
    <div id="ingImpact"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">${tt('ยกเลิก','Cancel')}</button><button class="btn primary" onclick="saveIng('${id ? jsq(id) : ''}')">${tt('บันทึก','Save')}</button></div>`);
  if (id) ingImpact(id);
}
function ingImpact(id){
  const box = document.getElementById('ingImpact'); if (!id || !box) return;
  const i = ingById(id); const np = +document.getElementById('i_price').value; if (!(np >= 0)) return;
  const aff = db.menu.filter(m => (db.recipes[m.id] || []).some(r => r.ingId === id));
  if (!aff.length) { box.innerHTML = `<div class="note">${tt('ยังไม่มีเมนูที่ใช้วัตถุดิบนี้','No menu uses this ingredient yet')}</div>`; return; }
  const st = calcStats(); const qtyOf = mid => st.list.find(x => x.m.id === mid)?.qty || 0; let tot = 0;
  const rowsH = aff.map(m => { const q = db.recipes[m.id].filter(r => r.ingId === id).reduce((a, r) => a + r.qty, 0); const dRaw = (np - i.price) * q; const d = dRaw * (1 + m.wastePct);
    const newFc = (realCost(m) + d) / m.price; tot += -d * qtyOf(m.id) * 30 / Math.max(st.R.days, 1);
    return `<tr><td>${esc(mName(m))}</td><td class="num">${fmtB(costOf(m), 2)} → <b>${fmtB(costOf(m) + dRaw, 2)}</b></td><td class="num"><span class="${newFc > S().targetFC ? 'down' : 'up'}">${pct(newFc)}</span></td></tr>`; }).join('');
  box.innerHTML = `<div class="card" style="background:#f8f9fc;box-shadow:none;padding:12px"><h3 style="font-size:12.5px">${tt('ผลกระทบต่อเมนู','Impact on menus')} (${aff.length})</h3>
    <div class="tbl-wrap"><table><thead><tr><th>${tt('เมนู','Menu')}</th><th class="num">${tt('ต้นทุนวัตถุดิบ','Ingr. cost')}</th><th class="num">${tt('Food cost ใหม่','New food cost')}</th></tr></thead><tbody>${rowsH}</tbody></table></div>
    <div class="impact total"><span>${tt('กำไรเปลี่ยน ต่อ 30 วัน (ถ้าไม่ปรับราคา)','Profit change per 30 days (if prices stay)')}</span><span class="${tot >= 0 ? 'up' : 'down'}">${fmtSigned(tot)}</span></div></div>`;
}
function saveIng(id){
  clearErr(); const v = x => document.getElementById(x).value.trim();
  const name = v('i_name'), unit = v('i_unit'), price = +v('i_price'); let ok = true;
  if (!name) { fieldErr('i_name', tt('กรุณากรอกชื่อ','Required')); ok = false; }
  if (!unit) { fieldErr('i_unit', tt('กรุณากรอกหน่วย','Required')); ok = false; }
  if (!(price >= 0) || v('i_price') === '') { fieldErr('i_price', tt('ราคา 0 ขึ้นไป','Price ≥ 0')); ok = false; }
  if (!ok) return;
  const rec = {name, nameEn:v('i_en'), unit, price};
  if (id) Object.assign(ingById(id), rec); else db.ingredients.push({id:nextIngId(), ...rec});
  Object.keys(db.recipes).forEach(mid => { const m = menuById(mid); const rc = recipeCost(mid); if (m && rc !== null) m.cost = +rc.toFixed(2); });
  db.isSample = false; saveDB(); closeModal(); toast(tt('บันทึกแล้ว — ต้นทุนเมนูอัปเดตแล้ว ✓','Saved — menu costs updated ✓')); render();
}
function delIng(id){
  const n = db.menu.filter(m => (db.recipes[m.id] || []).some(r => r.ingId === id)).length;
  askConfirm(tt(`ลบวัตถุดิบนี้? จะถูกเอาออกจากสูตร ${n} เมนู`, `Delete this ingredient? It will be removed from ${n} recipes.`), () => {
    db.ingredients = db.ingredients.filter(i => i.id !== id);
    Object.keys(db.recipes).forEach(mid => { db.recipes[mid] = db.recipes[mid].filter(r => r.ingId !== id); if (!db.recipes[mid].length) delete db.recipes[mid]; });
    saveDB(); render(); }, tt('ลบ','Delete'));
}
function exportIngCSV(){ download(`ingredients_${todayISO()}.csv`, toCSV([['id','name','name_en','unit','price'], ...db.ingredients.map(i => [i.id, i.name, i.nameEn || '', i.unit, i.price])])); }
function importIngCSV(){
  if (demoBlocked()) return;
  pickFile('.csv,.txt', text => {
    const rows = parseCSV(text); if (rows.length < 2) return toast(tt('ไฟล์ว่าง','Empty file'));
    const H = rows[0]; const c = {id:findCol(H, ['id']), name:findCol(H, ['name','ชื่อ','วัตถุดิบ']), en:findCol(H, ['name_en']), unit:findCol(H, ['unit','หน่วย']), price:findCol(H, ['price','ราคา'])};
    if (c.name < 0 || c.price < 0) return toast(tt('ต้องมีคอลัมน์ name และ price','Columns "name" and "price" are required'));
    let n = 0; rows.slice(1).forEach(r => { const name = r[c.name], price = num(r[c.price]); if (!name || !(price >= 0)) return;
      const ex = (c.id >= 0 && ingById(r[c.id])) || db.ingredients.find(i => i.name === name);
      const rec = {name, nameEn:c.en >= 0 ? r[c.en] : (ex?.nameEn || ''), unit:c.unit >= 0 ? r[c.unit] : (ex?.unit || ''), price};
      if (ex) Object.assign(ex, rec); else db.ingredients.push({id:nextIngId(), ...rec}); n++; });
    Object.keys(db.recipes).forEach(mid => { const m = menuById(mid); const rc = recipeCost(mid); if (m && rc !== null) m.cost = +rc.toFixed(2); });
    db.isSample = false; saveDB(); render(); toast(tt(`นำเข้า/อัปเดต ${n} วัตถุดิบ ✓`, `Imported/updated ${n} ingredients ✓`));
  });
}

/* ================= POS bill import wizard ================= */
let pos = null;
function openPosImport(){
  if (demoBlocked()) return;
  if (!db.menu.length) { toast(tt('กรุณาเพิ่มหรือนำเข้าเมนูก่อน','Add or import your menus first')); return; }
  pickFile('.csv,.txt', (text, fname) => {
    const rows = parseCSV(text);
    if (rows.length < 2) { toast(tt('ไฟล์ว่างหรืออ่านไม่ได้','File is empty or unreadable')); return; }
    const H = rows[0];
    pos = {fname, H, data:rows.slice(1), step:1, regen:true, replace:true, map:{
      bill:findCol(H, ['bill_no','bill','receipt','order','เลขที่บิล','เลขที่ใบเสร็จ','ใบเสร็จ','บิล','order_id','ticket']),
      date:findCol(H, ['date','datetime','วันที่','วันเวลา','created']), time:findCol(H, ['time','เวลา']),
      item:findCol(H, ['item','menu','product','สินค้า','รายการ','เมนู','ชื่อสินค้า','name','sku']), qty:findCol(H, ['qty','quantity','จำนวน','amount_qty'])}, alias:{}};
    renderPos();
  });
}
function renderPos(){
  const {H, data, map} = pos;
  const sel = (k, req) => `<select onchange="pos.map.${k}=+this.value;renderPos()" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:6px">${req ? '' : `<option value="-1">— ${tt('ไม่มี','none')} —</option>`}${req && map[k] < 0 ? `<option value="-1" selected>— ${tt('เลือกคอลัมน์','choose')} —</option>` : ''}${H.map((h, i) => `<option value="${i}" ${map[k] === i ? 'selected' : ''}>${esc(h || '(' + (i + 1) + ')')}</option>`).join('')}</select>`;
  const steps = `<div class="steps">${[tt('1 จับคู่คอลัมน์','1 Map columns'), tt('2 จับคู่ชื่อเมนู','2 Match items'), tt('3 ยืนยัน','3 Confirm')].map((s, i) => `<span class="${pos.step === i + 1 ? 'on' : ''}">${s}</span>`).join('')}</div>`;
  if (pos.step === 1) {
    const okMap = map.bill >= 0 && map.date >= 0 && map.item >= 0;
    if (map.date >= 0) detectDateOrder(data.map(r => r[map.date]));
    openModal(`<h3>⬆ ${tt('นำเข้าบิลจาก POS','Import POS bills')} <span class="sub-txt">${esc(pos.fname)} · ${fmt(data.length)} ${tt('แถว','rows')}</span></h3>${steps}
      <p class="sub-txt" style="margin-bottom:10px">${tt('ไฟล์ CSV หนึ่งแถว = หนึ่งรายการในบิล (บิลเดียวมีหลายแถวได้) · จาก Excel ให้ Save As เป็น CSV (รองรับทั้ง CSV UTF-8 และ CSV ภาษาไทยแบบเดิม)','CSV with one row per line item (a bill can span many rows) · from Excel, Save As CSV (UTF-8 or Thai Windows-874 both work)')}</p>
      <div class="frow"><div class="field"><label>${tt('เลขที่บิล','Bill number')} *</label>${sel('bill', true)}</div><div class="field"><label>${tt('วันที่','Date')} *</label>${sel('date', true)}</div></div>
      <div class="frow"><div class="field"><label>${tt('ชื่อเมนู / รหัส','Item name / ID')} *</label>${sel('item', true)}</div><div class="field"><label>${tt('จำนวน','Quantity')}</label>${sel('qty', false)}<div class="hint">${tt('ถ้าไม่มี นับเป็น 1','Defaults to 1')}</div></div></div>
      <div class="frow"><div class="field"><label>${tt('เวลา','Time')}</label>${sel('time', false)}</div></div>
      <h3 style="font-size:12.5px;margin:6px 0">${tt('ตัวอย่างข้อมูล','Preview')} <span class="sub-txt">· ${tt('รูปแบบวันที่ที่ตรวจพบ','detected date format')}: ${dateOrder === 'mdy' ? tt('เดือน/วัน/ปี','month/day/year') : tt('วัน/เดือน/ปี','day/month/year')}</span></h3>
      <div class="tbl-wrap"><table><thead><tr><th>${tt('บิล','Bill')}</th><th>${tt('วันที่ (อ่านได้)','Date (parsed)')}</th><th>${tt('เมนู','Item')}</th><th class="num">${tt('จำนวน','Qty')}</th></tr></thead><tbody>
      ${data.slice(0, 5).map(r => `<tr><td>${esc(r[map.bill] ?? '')}</td><td>${map.date >= 0 ? (parseDate(r[map.date]) ? dispDate(parseDate(r[map.date])) : '<span class="down">' + esc(r[map.date]) + ' ✗</span>') : ''}</td><td>${esc(r[map.item] ?? '')}</td><td class="num">${map.qty >= 0 ? esc(r[map.qty]) : 1}</td></tr>`).join('')}</tbody></table></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">${tt('ยกเลิก','Cancel')}</button><button class="btn primary" ${okMap ? '' : 'disabled'} onclick="posStep2()">${tt('ถัดไป','Next')} →</button></div>`, true);
  } else if (pos.step === 2) {
    const names = {}; data.forEach(r => { const n = String(r[map.item] || '').trim(); if (n) names[n] = (names[n] || 0) + 1; });
    const unmatched = Object.entries(names).filter(([n]) => !matchMenu(n) && pos.alias[n.toLowerCase()] === undefined);
    const matched = Object.keys(names).length - unmatched.length;
    pos.unmatched = Object.entries(names).filter(([n]) => !matchMenu(n));
    openModal(`<h3>⬆ ${tt('จับคู่ชื่อเมนู','Match item names')}</h3>${steps}
      <p style="font-size:12.5px;margin-bottom:10px">✅ ${tt('จับคู่อัตโนมัติได้','Auto-matched')} <b>${matched}</b> ${tt('ชื่อ','names')} · ${pos.unmatched.length ? `⚠️ ${tt('ต้องเลือกเอง','need your help')} <b>${pos.unmatched.length}</b>` : '🎉'}</p>
      ${pos.unmatched.length ? `<div class="tbl-wrap scroll" style="max-height:320px"><table><thead><tr><th>${tt('ชื่อในไฟล์ POS','Name in POS file')}</th><th class="num">${tt('แถว','Rows')}</th><th>${tt('ตรงกับเมนู','Maps to menu')}</th></tr></thead><tbody>
        ${pos.unmatched.map(([n, c]) => `<tr><td>${esc(n)}</td><td class="num">${c}</td><td><select style="width:100%;border:1px solid var(--line);border-radius:7px;padding:5px" onchange="pos.alias['${jsq(n.toLowerCase())}']=this.value">
          <option value="" ${!pos.alias[n.toLowerCase()] ? 'selected' : ''}>— ${tt('ข้าม (ไม่ใช่เมนูอาหาร)','skip (not a menu item)')} —</option>${db.menu.map(m => `<option value="${esc(m.id)}" ${pos.alias[n.toLowerCase()] === m.id ? 'selected' : ''}>${esc(m.id)} — ${esc(mName(m))}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>
        <p class="sub-txt" style="margin-top:8px">${tt('การจับคู่จะถูกจำไว้ ครั้งหน้านำเข้าจะจับคู่ให้อัตโนมัติ','Your matches are remembered for next time')}</p>` : ''}
      <div class="modal-actions"><button class="btn" onclick="pos.step=1;renderPos()">← ${tt('ย้อนกลับ','Back')}</button><button class="btn primary" onclick="posStep3()">${tt('ถัดไป','Next')} →</button></div>`, true);
  } else {
    const p = pos.preview;
    openModal(`<h3>⬆ ${tt('ยืนยันการนำเข้า','Confirm import')}</h3>${steps}
      <div class="impact"><span class="l">${tt('บิลที่อ่านได้','Bills found')}</span><b>${fmt(p.bills.length)}</b></div>
      <div class="impact"><span class="l">${tt('รายการอาหาร (จาน)','Dishes')}</span><b>${fmt(p.dishes)}</b></div>
      <div class="impact"><span class="l">${tt('ช่วงวันที่','Date range')}</span><b>${dispDate(p.min)} – ${dispDate(p.max)}</b> <span class="sub-txt">(${p.dates.size} ${tt('วัน','days')})</span></div>
      <div class="impact"><span class="l">${tt('แถวที่ข้าม','Rows skipped')}</span><b>${fmt(p.skipped)}</b> <span class="sub-txt">${tt('(วันที่อ่านไม่ได้ / ไม่ใช่เมนู / จำนวนผิด)','(bad date / not a menu / bad qty)')}</span></div>
      <div style="margin-top:14px">
        <label class="chk"><input type="checkbox" ${pos.replace ? 'checked' : ''} onchange="pos.replace=this.checked"> ${tt('แทนที่บิลเดิมในวันที่ซ้ำกัน (กันนำเข้าซ้ำ)','Replace existing bills on the same dates (prevents duplicates)')}</label>
        <label class="chk"><input type="checkbox" ${pos.regen ? 'checked' : ''} onchange="pos.regen=this.checked"> ${tt('สร้างยอดขายรายวันจากบิลด้วย (แทนที่ยอดขายเดิมของวันเหล่านั้น) — แนะนำ','Also build daily sales from these bills (replaces daily sales on those dates) — recommended')}</label>
      </div>
      <div class="modal-actions"><button class="btn" onclick="pos.step=2;renderPos()">← ${tt('ย้อนกลับ','Back')}</button><button class="btn primary" ${p.bills.length ? '' : 'disabled'} onclick="posCommit()">${tt('นำเข้า','Import')} ${fmt(p.bills.length)} ${tt('บิล','bills')}</button></div>`, true);
  }
}
function posStep2(){ pos.step = 2; renderPos(); }
function posStep3(){
  const {data, map} = pos;
  detectDateOrder(data.map(r => r[map.date])); const get = n => { const k = String(n || '').trim().toLowerCase(); if (pos.alias[k] !== undefined) return pos.alias[k] ? menuById(pos.alias[k]) : null; return matchMenu(n); };
  const B = new Map(); let skipped = 0, dishes = 0; const dates = new Set(); let min = null, max = null;
  data.forEach(r => {
    const date = parseDate(r[map.date]); const m = get(r[map.item]); const qty = map.qty >= 0 ? num(r[map.qty]) : 1; const no = String(r[map.bill] || '').trim();
    if (!date || !m || !(qty > 0) || !no) { skipped++; return; }
    const key = date + '|' + no; let b = B.get(key);
    if (!b) { b = {no, date, time:map.time >= 0 ? parseTime(r[map.time]) : parseTime(r[map.date]), items:[]}; B.set(key, b); }
    const it = b.items.find(i => i.menuId === m.id); if (it) it.qty += qty; else b.items.push({menuId:m.id, qty});
    dishes += qty; dates.add(date); if (!min || date < min) min = date; if (!max || date > max) max = date;
  });
  pos.preview = {bills:[...B.values()], skipped, dishes, dates, min, max};
  pos.step = 3; renderPos();
}
function posCommit(){
  const p = pos.preview;
  Object.entries(pos.alias).forEach(([k, v]) => { if (v) S().alias[k] = v; });
  if (pos.replace) db.bills = db.bills.filter(b => !p.dates.has(b.date));
  else { const keys = new Set(db.bills.map(b => b.date + '|' + b.no)); p.bills = p.bills.filter(b => !keys.has(b.date + '|' + b.no)); }
  db.bills.push(...p.bills);
  if (pos.regen) {
    db.sales = db.sales.filter(s => !p.dates.has(s.date));
    const agg = {}; db.bills.filter(b => p.dates.has(b.date)).forEach(b => b.items.forEach(i => { const k = b.date + '|' + i.menuId; agg[k] = (agg[k] || 0) + i.qty; }));
    let id = nextLogId(db.sales); Object.entries(agg).sort().forEach(([k, q]) => { const [date, menuId] = k.split('|'); db.sales.push({id:id++, date, menuId, qty:q}); });
  }
  db.isSample = false; saveDB(); closeModal(); pos = null;
  toast(tt(`นำเข้า ${fmt(p.bills.length)} บิลแล้ว ✓`, `Imported ${fmt(p.bills.length)} bills ✓`), 3000); range.preset = 'all'; saveRange(); render();
}
function delBill(no, date){ askConfirm(tt('ลบบิลนี้? (ยอดขายรายวันจะไม่เปลี่ยน)','Delete this bill? (daily sales are not changed)'), () => { db.bills = db.bills.filter(b => !(b.no === no && b.date === date)); saveDB(); render(); }, tt('ลบ','Delete')); }

/* ================= init ================= */
if (typeof Chart !== 'undefined') { Chart.defaults.font.family = "'Prompt',system-ui,sans-serif"; Chart.defaults.color = '#5b6478'; }
loadDB();
document.documentElement.lang = lang;
render();
if (firstRun) welcome();
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); toggleNav(false); } });

</script>
